name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LottoLabMobile-1.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LottoLabMobile-debug-apk
          path: LottoLabMobile-1.1.apk

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lotto-lab-v1.1"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release già presente"
          else
            gh release create "$TAG" \
              --title "Lotto Lab Mobile 1.1" \
              --notes "Versione 1.1 - aggiornamento automatico estrazioni e tutte le ruote."
          fi

          gh release upload "$TAG" LottoLabMobile-1.1.apk --clobber
