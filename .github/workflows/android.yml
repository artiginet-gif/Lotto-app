name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          LOTTO_KEYSTORE_BASE64: ${{ secrets.LOTTO_KEYSTORE_BASE64 }}
        run: |
          echo "$LOTTO_KEYSTORE_BASE64" | base64 --decode > app/lotto-lab-release.jks

      - name: Build signed release APK
        env:
          LOTTO_KEYSTORE_PATH: lotto-lab-release.jks
          LOTTO_KEYSTORE_PASSWORD: ${{ secrets.LOTTO_KEYSTORE_PASSWORD }}
          LOTTO_KEY_ALIAS: ${{ secrets.LOTTO_KEY_ALIAS }}
          LOTTO_KEY_PASSWORD: ${{ secrets.LOTTO_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk LottoLabMobile-1.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LottoLabMobile-1.3-apk
          path: LottoLabMobile-1.3.apk

      - name: Create or update Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="lotto-lab-v1.3"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release già presente"
          else
            gh release create "$TAG" \
              --title "Lotto Lab Mobile 1.3" \
              --notes "Versione 1.3: nuova grafica, ultime estrazioni, Sistema 8 e SuperEnalotto."
          fi

          gh release upload "$TAG" LottoLabMobile-1.3.apk --clobber
