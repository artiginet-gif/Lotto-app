plugins { id 'com.android.application' }

android {
    namespace 'it.artiginet.lottolab'
    compileSdk 35

    signingConfigs {
        release {
            storeFile file(System.getenv("LOTTO_KEYSTORE_PATH") ?: "lotto-lab-release.jks")
            storePassword System.getenv("LOTTO_KEYSTORE_PASSWORD")
            keyAlias System.getenv("LOTTO_KEY_ALIAS")
            keyPassword System.getenv("LOTTO_KEY_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "it.artiginet.lottolab"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
